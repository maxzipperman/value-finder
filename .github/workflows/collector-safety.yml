name: Collector safety
on:
  pull_request:
    paths: ['ops/collector_guard.py', 'ops/install_live_uses.sh', 'ops/collector-safety/**', 'nfl-weather/nflweather/oddsapi.py', 'nfl-weather/scripts/log_props.py', 'cfb-weather/cfbweather/live.py', 'sharp-markets/src/markets/collector.py', 'sharp-markets/src/markets/http.py', 'sharp-markets/tests/test_collector.py', 'sharp-markets/tests/test_http.py', '.github/workflows/collector-safety.yml', 'GOVERNANCE.md']
  push:
    branches: [main]
    paths: ['ops/collector_guard.py', 'ops/install_live_uses.sh', 'ops/collector-safety/**', 'nfl-weather/nflweather/oddsapi.py', 'nfl-weather/scripts/log_props.py', 'cfb-weather/cfbweather/live.py', 'sharp-markets/src/markets/collector.py', 'sharp-markets/src/markets/http.py', 'sharp-markets/tests/test_collector.py', 'sharp-markets/tests/test_http.py', '.github/workflows/collector-safety.yml', 'GOVERNANCE.md']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest requests pandas pyarrow pyyaml python-dotenv duckdb
      - name: Bind complete inputs and run synthetic guard, collector and localhost HTTP checks
        run: |
          python -B ops/process/process_guard.py test --config ops/collector-safety/verification.json --output collector-safety-evidence.json
          python -B ops/process/process_guard.py verify-test --config ops/collector-safety/verification.json --saved collector-safety-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collector-safety-${{ github.sha }}
          path: collector-safety-evidence.json
