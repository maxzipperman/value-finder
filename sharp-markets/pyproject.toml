[project]
name = "sharp-markets"
version = "0.1.0"
description = "Paper-only research pipeline: Kalshi game markets vs sharp sportsbook lines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "numpy>=2.5.3",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pytz>=2026.4",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
markets = "markets.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
