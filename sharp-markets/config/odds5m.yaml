# The 5M-credit Odds API month (strategy-research/odds-api-credits.md, "The 5M month").
# Sport configs for the bulk historical puller (markets.oddsapi.bulk). Not used by the Kalshi pipeline.
#
# windows: date ranges (UTC dates) swept with the historical /events endpoint to build exact
# schedules; clipped to history_from. sealed: true = the season is a sealed holdout (pulled while the
# credits last, never analysed until a hypothesis about it is pre-registered). Default rule, pending
# the owner's decision 1: calendar-2026 games for MLB, soccer and the World Cup; the 2026 season for
# NFL and CFB; 2026-27 for NBA and NHL (2025-26 is the NBA study season in docs/PLAN.md).

