# The 5M-credit Odds API month (strategy-research/odds-api-credits.md, "The 5M month").
# Sport configs for the bulk historical puller (markets.oddsapi.bulk). Not used by the Kalshi pipeline.
#
# windows: date ranges (UTC dates) swept with the historical /events endpoint to build exact
# schedules; clipped to history_from. sealed: true = the season is a sealed holdout (pulled while the
# credits last, never analysed until a hypothesis about it is pre-registered). Owner decision 1
# (Sep 28): calendar-2026 games for MLB, soccer and the World Cup; the 2026 season for NFL and CFB;
# 2026-27 for NBA and NHL (2025-26 is the NBA study season in docs/PLAN.md).
#
# Each sealed window starts at least one day before its season's first game and ends at least one day after
# its last game (finals, title games, playoffs), both in UTC: a game outside every window gets no season,
# so it would be neither planned nor sealed. The comment above each sealed window gives the two games and
# the source (checked Sep 29, 2026); tests/test_bulk.py checks them in UTC. One exception, for now: NCAAF
# 2026 ends before its title game (see there).

books:
  us10: [pinnacle, lowvig, betonlineag, draftkings, fanduel, betmgm, williamhill_us, fanatics, betrivers, espnbet]
  soccer10: [pinnacle, betonlineag, draftkings, fanduel, betmgm, williamhill_us, bovada, unibet_eu, marathonbet, betfair_ex_eu]
  sharp3: [pinnacle, lowvig, betonlineag]

featured: h2h,spreads,totals

sports:
  americanfootball_nfl:
    history_from: 2020-06-06
    sweep_every_days: 2
    windows:
