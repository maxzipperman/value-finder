# NBA sport config. Everything sport-specific lives here or in config/teams/nba.csv.
sport: nba

kalshi:
  series_ticker: KXNBAGAME
  # Scheduled tip = expected_expiration_time - tip_offset_hours. Verified 115/117 vs ESPN (2025-26).
  # Used ONLY for candidate matching / candle windows; Odds API commence_time is the source of truth.
  tip_offset_hours: 3
  # Candle fetch window: market open -> est tip + fetch_after_tip_min (analysis trims to commence + 15m).
  fetch_after_tip_min: 60
  candle_period_min: 1

espn:
  league_path: basketball/nba      # site.api.espn.com scoreboard; used only for the one-time Cup calendar

odds_api:
  sport_key: basketball_nba
  bookmakers: [pinnacle, lowvig, betonlineag]
  markets: h2h

# Title patterns that mark non-regular-season games (checked before date windows).
phase_title_rules:
  - {pattern: '^(East|West) Play-In:', phase: play_in}
  - {pattern: '^Game \d+:', phase: playoffs}

seasons:
  "2025-26":
    events_from: 2025-09-01        # ET game dates belonging to this season label
    events_to: 2026-07-15
    regular_start: 2025-10-21
    regular_end: 2026-04-12
    train_end: 2026-01-31          # train <= train_end < validate
    cup_calendar: config/nba_cup_2025_26.csv   # one-time ESPN pull, user-reviewed
    cup_scan_from: 2025-10-31
    cup_scan_to: 2025-12-16
  "2026-27":
    events_from: 2026-09-01
    events_to: 2027-07-15
    regular_start: 2026-10-20
    regular_end: 2027-04-11        # placeholder until the NBA publishes the schedule
    train_end: null                # forward out-of-sample season

# Forward collector (docs/PLAN.md section 7; src/markets/collector.py). Paper-only, GET-only.
collector:
  start: 2026-10-20                # the NBA opener; ticks before this date do nothing
  window_before_tip_hours: 56      # Kalshi game markets open about 56h before tip (PLAN.md section 1)
  window_after_tip_min: 15
  every_min: 5                     # 1 Odds API credit per acting tick
  final_minutes: 120
  final_every_min: null            # 1 = one-minute ticks in the final 2h (PLAN.md section 3, about +100 credits a day); off until decided

flags:
  lifetime_flag_days: 14           # flag only; NBA markets routinely live > 3 days
  tip_diff_flag_min: 30
