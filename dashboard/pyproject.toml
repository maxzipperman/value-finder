[project]
name = "vfdash"
version = "0.1.0"
description = "Value Finder: a local, read-only dashboard for the Mac (paper only)"
requires-python = ">=3.12"
dependencies = []

# Lets `uv run --project dashboard pytest -q`, typed at the repo root, collect dashboard/tests only
# (vfdash/pytest_plugin.py). It exists only in the dashboard's own environment.
[project.entry-points.pytest11]
vfdash = "vfdash.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vfdash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
